sonar.organization=soham2008xyz
sonar.projectKey=soham2008xyz_transmission-nextjs

# The analysis scope covers the whole repo by default, including
# .github/workflows and the test suites. Only skip generated output.
sonar.exclusions=coverage/**

# Written by `npm run test:coverage` (vitest.config.mts).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Match the coverage exclusions in vitest.config.mts, plus tool config files.
sonar.coverage.exclusions=src/components/ui/**,src/app/layout.tsx,src/lib/types.ts,*.config.*
