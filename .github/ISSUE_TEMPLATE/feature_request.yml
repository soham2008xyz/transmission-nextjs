name: Feature Request
description: Suggest a new feature or improvement for the Transmission Next.js web UI
title: "Feature: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe the problem you're trying
        to solve and how you'd like it to work.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the feature.
      placeholder: e.g., Add a search box to filter torrents by name
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this needed? What problem does it solve for you?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should this work? Feel free to include rough UI sketches or flows.
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true for this to count as done?
      placeholder: |
        - [ ] Search box appears in the torrents toolbar
        - [ ] Filtering matches case-insensitively on torrent name
        - [ ] Works with the existing RPC methods (no new daemon permissions)
      render: markdown
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you ruled them out.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, screenshots, or related issues.
    validations:
      required: false